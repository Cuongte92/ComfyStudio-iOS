name: Build ComfyStudio Hybrid IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ipa:
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build tools (cmake, llvm, grpc, flatbuffers)
        run: brew install cmake llvm grpc protobuf flatbuffers

      - name: Generate Draw Things gRPC Proto & FlatBuffers C++ Code
        run: |
          mkdir -p dt_schema dt_gen

          cat << 'EOF' > dt_schema/imageService.proto
          syntax = "proto3";

          service ImageGenerationService {
            rpc GenerateImage (ImageGenerationRequest) returns (stream ImageGenerationResponse) {}
            rpc FilesExist (FileListRequest) returns (FileExistenceResponse) {}
            rpc UploadFile (stream FileUploadRequest) returns (stream UploadResponse) {}
            rpc Echo (EchoRequest) returns (EchoReply) {}
            rpc Pubkey (PubkeyRequest) returns (PubkeyResponse) {}
            rpc Hours (HoursRequest) returns (HoursResponse) {}
          }

          message EchoRequest {
            string name = 1;
          }

          message EchoReply {
            string message = 1;
            repeated string files = 2;
          }

          message PubkeyRequest {
            string name = 1;
          }

          message PubkeyResponse {
            string message = 1;
            string pubkey = 2;
          }

          message HoursRequest {
          }

          message HoursResponse {
            double thresholds = 1;
          }

          message FileListRequest {
            repeated string files = 1;
            repeated string filesWithHash = 2;
          }

          message FileExistenceResponse {
            repeated string files = 1;
            repeated bool existences = 2;
            repeated bytes hashes = 3;
          }

          message MetadataOverride {
            bytes models = 1;
            bytes loras = 2;
            bytes controlNets = 3;
            bytes textualInversions = 4;
            bytes upscalers = 5;
          }

          message ImageGenerationRequest {
            bytes image = 1;
            int32 scaleFactor = 2;
            bytes mask = 3;
            repeated HintProto hints = 4;
            string prompt = 5;
            string negativePrompt = 6;
            bytes configuration = 7;
            MetadataOverride override = 8;
            repeated string keywords = 9;
            string user = 10;
            DeviceType device = 11;
            repeated bytes contents = 12;
            bool chunked = 13;
          }

          enum DeviceType {
            PHONE = 0;
            TABLET = 1;
            LAPTOP = 2;
          }

          message HintProto {
            string hintType = 1;
            repeated TensorAndWeight tensors = 2;
          }

          message TensorAndWeight {
            bytes tensor = 1;
            float weight = 2;
          }

          message ImageGenerationSignpost {
            message TextEncoded {}
            message ImageEncoded {}
            message Sampling {
              int32 step = 1;
            }
            message ImageDecoded {}
            message SecondPassImageEncoded {}
            message SecondPassSampling {
              int32 step = 1;
            }
            message SecondPassImageDecoded {}
            message FaceRestored {}
            message ImageUpscaled {}
            oneof signpost {
              TextEncoded text_encoded = 1;
              ImageEncoded image_encoded = 2;
              Sampling sampling = 3;
              ImageDecoded image_decoded = 4;
              SecondPassImageEncoded second_pass_image_encoded = 5;
              SecondPassSampling second_pass_sampling = 6;
              SecondPassImageDecoded second_pass_image_decoded = 7;
              FaceRestored face_restored = 8;
              ImageUpscaled image_upscaled = 9;
            }
          }

          message ImageGenerationResponse {
            repeated bytes generatedImages = 1;
            ImageGenerationSignpost currentSignpost = 2;
            repeated ImageGenerationSignpost signposts = 3;
            bytes previewImage = 4;
            int32 scaleFactor = 5;
            repeated bytes generatedAudio = 6;
            bool chunked = 7;
            bool downloadSize = 8;
          }

          message FileUploadRequest {
            string filename = 1;
            bytes content = 2;
            int64 offset = 3;
            int64 totalSize = 4;
          }

          message UploadResponse {
            bool chunkUploadSuccess = 1;
            string receivedUploadFilename = 2;
            int64 currentOffset = 3;
            string message = 4;
          }
          EOF

          cat << 'EOF' > dt_schema/config.fbs
          enum SamplerType: byte {
            DPMPP2MKarras = 0,
            EulerA = 1,
            DDIM = 2,
            PLMS = 3,
            DPMPPSDEKarras = 4,
            UniPC = 5,
            LCM = 6,
            EulerASubstep = 7,
            DPMPPSDESubstep = 8,
            TCD = 9,
            EulerATrailing = 10,
            DPMPPSDETrailing = 11,
            DPMPP2MAYS = 12,
            EulerAAYS = 13,
            DPMPPSDEAYS = 14,
            DPMPP2MTrailing = 15,
            DDIMTrailing = 16,
            UniPCTrailing = 17,
            UniPCAYS = 18
          }

          enum SeedMode: byte {
            Legacy = 0,
            TorchCpuCompatible = 1,
            ScaleAlike = 2,
            NvidiaGpuCompatible = 3
          }

          enum ControlMode: byte {
            Balanced = 0,
            Prompt = 1,
            Control = 2
          }

          enum ControlInputType: byte {
            Unspecified = 0,
            Custom = 1,
            Depth = 2,
            Canny = 3,
            Scribble = 4,
            Pose = 5,
            Normalbae = 6,
            Color = 7,
            Lineart = 8,
            Softedge = 9,
            Seg = 10,
            Inpaint = 11,
            Ip2p = 12,
            Shuffle = 13,
            Mlsd = 14,
            Tile = 15,
            Blur = 16,
            Lowquality = 17,
            Gray = 18
          }

          enum LoRAMode: byte {
            All = 0,
            Base = 1,
            Refiner = 2
          }

          table Control {
            file: string;
            weight: float = 1.0;
            guidance_start: float = 0.0;
            guidance_end: float = 1.0;
            no_prompt: bool = false;
            global_average_pooling: bool = true;
            down_sampling_rate: float = 1.0;
            control_mode: ControlMode = Balanced;
            target_blocks: [string];
            input_override: ControlInputType = Unspecified;
          }

          table LoRA {
            file: string;
            weight: float = 0.6;
            mode: LoRAMode = All;
          }

          table GenerationConfiguration {
            id: long = 0;
            start_width: ushort;
            start_height: ushort;
            seed: uint;
            steps: uint;
            guidance_scale: float;
            strength: float;
            model: string;
            sampler: SamplerType = DPMPP2MKarras;
            batch_count: uint = 1;
            batch_size: uint = 1;
            hires_fix: bool = false;
            hires_fix_start_width: ushort;
            hires_fix_start_height: ushort;
            hires_fix_strength: float = 0.7;
            upscaler: string;
            image_guidance_scale: float = 1.5;
            seed_mode: SeedMode = Legacy;
            clip_skip: uint = 1;
            controls: [Control];
            loras: [LoRA];
            mask_blur: float = 1.5;
            face_restoration: string;
            decode_with_attention: bool = true;
            hires_fix_decode_with_attention: bool = true;
            clip_weight: float = 1.0;
            negative_prompt_for_image_prior: bool = true;
            image_prior_steps: uint = 5;
            refiner_model: string;
            original_image_height: uint;
            original_image_width: uint;
            crop_top: int;
            crop_left: int;
            target_image_height: uint;
            target_image_width: uint;
            aesthetic_score: float = 6.0;
            negative_aesthetic_score: float = 2.5;
            zero_negative_prompt: bool = false;
            refiner_start: float = 0.85;
            negative_original_image_height: uint;
            negative_original_image_width: uint;
            name: string;
            fps_id: uint = 5;
            motion_bucket_id: uint = 127;
            cond_aug: float = 0.02;
            start_frame_cfg: float = 1.0;
            num_frames: uint = 14;
            mask_blur_outset: int = 0;
            sharpness: float = 0.0;
            shift: float = 1.0;
            stage_2_steps: uint = 10;
            stage_2_cfg: float = 1.0;
            stage_2_shift: float = 1.0;
            tiled_decoding: bool = false;
            decoding_tile_width: ushort = 10;
            decoding_tile_height: ushort = 10;
            decoding_overlap: ushort = 2;
            stochastic_sampling_gamma: float = 0.3;
            preserve_original_after_inpaint: bool = true;
            tiled_diffusion: bool = false;
            diffusion_tile_width: ushort = 16;
            diffusion_tile_height: ushort = 16;
            diffusion_overlap: ushort = 2;
            upscaler_scale_factor: ubyte = 0;
            t5_text_encoder: bool = true;
            separate_clip_l: bool = false;
            clip_l_text: string;
            separate_open_clip_g: bool = false;
            open_clip_g_text: string;
            speed_up_with_guidance_embed: bool = true;
            guidance_embed: float = 3.5;
            resolution_dependent_shift: bool = true;
            tea_cache_start: int = 5;
            tea_cache_end: int = -1;
            tea_cache_threshold: float = 0.06;
            tea_cache: bool = false;
            separate_t5: bool = false;
            t5_text: string;
            tea_cache_max_skip_steps: int = 3;
            causal_inference_enabled: bool = false;
            causal_inference: int = 3;
            causal_inference_pad: int = 0;
            cfg_zero_star: bool = false;
            cfg_zero_init_steps: int = 0;
          }

          root_type GenerationConfiguration;
          EOF

          PROTOC="$(brew --prefix protobuf)/bin/protoc"
          GRPC_CPP_PLUGIN="$(brew --prefix grpc)/bin/grpc_cpp_plugin"
          FLATC="$(brew --prefix flatbuffers)/bin/flatc"

          "$PROTOC" -I dt_schema --cpp_out=dt_gen --grpc_out=dt_gen --plugin=protoc-gen-grpc="$GRPC_CPP_PLUGIN" dt_schema/imageService.proto
          "$FLATC" --cpp -o dt_gen dt_schema/config.fbs

      - name: Clone & Build stable-diffusion.cpp (Metal + CLI objects)
        run: |
          git clone --recursive https://github.com/leejet/stable-diffusion.cpp.git sd_cpp
          cd sd_cpp

          sed -i '' '/install(/,$d' examples/cli/CMakeLists.txt
          sed -i '' 's/add_subdirectory(server)/# add_subdirectory(server)/g' examples/CMakeLists.txt

          SD_ROOT=$(pwd)
          INC_FLAGS="-I${SD_ROOT}/include -I${SD_ROOT}/thirdparty -I${SD_ROOT}/examples/common -I${SD_ROOT}/ggml/include"

          mkdir build_ios && cd build_ios

          cmake .. \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=16.0 \
            -DCMAKE_CXX_FLAGS="${INC_FLAGS}" \
            -DCMAKE_C_FLAGS="${INC_FLAGS}" \
            -DSD_METAL=ON \
            -DGGML_METAL=ON \
            -DGGML_METAL_EMBED_LIBRARY=ON \
            -DSD_BUILD_EXAMPLES=ON \
            -DBUILD_SHARED_LIBS=OFF \
            -DCMAKE_BUILD_TYPE=Release

          cmake --build . --target stable-diffusion --config Release -j$(sysctl -n hw.ncpu)
          cmake --build . --target sd-cli --config Release -j$(sysctl -n hw.ncpu) || true

          mkdir -p cli_objs
          find . -path "*sd-cli*.dir*" -name "*.o" -exec cp {} cli_objs/ \;

          LLVM_OBJCOPY="$(brew --prefix llvm)/bin/llvm-objcopy"
          for obj in cli_objs/*.o; do
            if nm -g "$obj" 2>/dev/null | grep -q " _main$"; then
              "$LLVM_OBJCOPY" --redefine-sym _main=_sd_cli_main "$obj"
            fi
          done

          ar rcs libsd_cli_all.a cli_objs/*.o
          ranlib libsd_cli_all.a

      - name: Build gRPC + Protobuf + FlatBuffers for iOS arm64
        run: |
          git clone --depth 1 -b v1.66.0 https://github.com/grpc/grpc.git grpc_src
          cd grpc_src
          git submodule update --init --depth 1 third_party/abseil-cpp third_party/protobuf third_party/re2 third_party/cares/cares third_party/boringssl-with-bazel
          mkdir build_ios && cd build_ios

          cmake .. \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=16.0 \
            -DCMAKE_CXX_STANDARD=17 \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DgRPC_INSTALL=OFF \
            -Dprotobuf_INSTALL=OFF \
            -DABSL_ENABLE_INSTALL=OFF \
            -DgRPC_BUILD_TESTS=OFF \
            -DgRPC_BUILD_CODEGEN=OFF \
            -DgRPC_BUILD_GRPC_CPP_PLUGIN=OFF \
            -DgRPC_BUILD_GRPC_CSHARP_PLUGIN=OFF \
            -DgRPC_BUILD_GRPC_NODE_PLUGIN=OFF \
            -DgRPC_BUILD_GRPC_OBJECTIVE_C_PLUGIN=OFF \
            -DgRPC_BUILD_GRPC_PHP_PLUGIN=OFF \
            -DgRPC_BUILD_GRPC_PYTHON_PLUGIN=OFF \
            -DgRPC_BUILD_GRPC_RUBY_PLUGIN=OFF \
            -Dprotobuf_BUILD_TESTS=OFF \
            -Dprotobuf_BUILD_PROTOC_BINARIES=OFF \
            -DBUILD_SHARED_LIBS=OFF \
            -DCMAKE_BUILD_TYPE=Release

          cmake --build . --target grpc++ --config Release -j$(sysctl -n hw.ncpu)

      - name: Compile Swift & Obj-C++ and Package IPA
        run: |
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          BUILD_DIR="build_out"
          APP_DIR="$BUILD_DIR/Payload/ComfyStudio.app"
          mkdir -p "$APP_DIR"

          cat << 'EOF' > "$APP_DIR/Info.plist"
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleExecutable</key>
            <string>ComfyStudio</string>
            <key>CFBundleIdentifier</key>
            <string>com.cuongte92.comfystudio</string>
            <key>CFBundleName</key>
            <string>ComfyStudio</string>
            <key>CFBundleDisplayName</key>
            <string>ComfyStudio</string>
            <key>CFBundleShortVersionString</key>
            <string>1.0.0</string>
            <key>CFBundleVersion</key>
            <string>1</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>LSRequiresIPhoneOS</key>
            <true/>
            <key>MinimumOSVersion</key>
            <string>16.0</string>
            <key>UIFileSharingEnabled</key>
            <true/>
            <key>LSSupportsOpeningDocumentsInPlace</key>
            <true/>
            <key>NSPhotoLibraryUsageDescription</key>
            <string>Chọn ảnh đầu vào cho Img2Img và Inpaint.</string>
            <key>NSPhotoLibraryAddUsageDescription</key>
            <string>Lưu ảnh đã tạo vào thư viện Ảnh.</string>
            <key>NSAppTransportSecurity</key>
            <dict>
              <key>NSAllowsArbitraryLoads</key>
              <true/>
            </dict>
            <key>UILaunchScreen</key>
            <dict/>
          </dict>
          </plist>
          EOF

          FB_INC="$(brew --prefix flatbuffers)/include"
          GRPC_INCS="-Igrpc_src/include -Igrpc_src/third_party/protobuf/src -Igrpc_src/third_party/abseil-cpp -Idt_gen -I${FB_INC}"

          clang++ -c dt_gen/imageService.pb.cc -o "$BUILD_DIR/imageService.pb.o" -arch arm64 -isysroot "$SDK_PATH" -mios-version-min=16.0 -std=c++17 $GRPC_INCS
          clang++ -c dt_gen/imageService.grpc.pb.cc -o "$BUILD_DIR/imageService.grpc.pb.o" -arch arm64 -isysroot "$SDK_PATH" -mios-version-min=16.0 -std=c++17 $GRPC_INCS

          clang++ -c Sources/SDWrapper.mm \
            -o "$BUILD_DIR/SDWrapper.o" \
            -arch arm64 \
            -isysroot "$SDK_PATH" \
            -mios-version-min=16.0 \
            -std=c++17 \
            -fobjc-arc \
            -Isd_cpp/include \
            -Isd_cpp/ggml/include \
            $GRPC_INCS

          SD_LIBS=$(find sd_cpp/build_ios -name "*.a")
          GRPC_LIBS=$(find grpc_src/build_ios -name "*.a")

          swiftc Sources/MyApp.swift Sources/ContentView.swift \
            "$BUILD_DIR/SDWrapper.o" \
            "$BUILD_DIR/imageService.pb.o" \
            "$BUILD_DIR/imageService.grpc.pb.o" \
            -o "$APP_DIR/ComfyStudio" \
            -target arm64-apple-ios16.0 \
            -sdk "$SDK_PATH" \
            -import-objc-header Sources/SDWrapper.h \
            -lc++ -lz -lresolv \
            -framework Foundation \
            -framework UIKit \
            -framework SwiftUI \
            -framework WebKit \
            -framework PhotosUI \
            -framework UniformTypeIdentifiers \
            -framework Metal \
            -framework MetalKit \
            -framework Accelerate \
            $SD_LIBS \
            $GRPC_LIBS

          cd "$BUILD_DIR"
          zip -r ../ComfyStudio.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ComfyStudio-iOS-IPA
          path: ComfyStudio.ipa

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: ComfyStudio Hybrid v1.0.${{ github.run_number }}
          files: ComfyStudio.ipa
          draft: false
          prerelease: false
