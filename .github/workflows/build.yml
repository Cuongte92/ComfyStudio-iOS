name: Build ComfyStudio Hybrid IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ipa:
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build tools (cmake, llvm)
        run: brew install cmake llvm

      - name: Clone & Build stable-diffusion.cpp (Metal + CLI objects)
        run: |
          git clone --recursive https://github.com/leejet/stable-diffusion.cpp.git sd_cpp
          cd sd_cpp

          # Vá lỗi BUNDLE DESTINATION khi cross-compile iOS và vô hiệu hóa build sd-server
          sed -i '' 's/RUNTIME DESTINATION bin/RUNTIME DESTINATION bin BUNDLE DESTINATION bin/g' examples/cli/CMakeLists.txt
          sed -i '' 's/add_subdirectory(server)/# add_subdirectory(server)/g' examples/CMakeLists.txt

          mkdir build_ios && cd build_ios

          cmake .. \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=16.0 \
            -DSD_METAL=ON \
            -DGGML_METAL=ON \
            -DGGML_METAL_EMBED_LIBRARY=ON \
            -DSD_BUILD_EXAMPLES=ON \
            -DBUILD_SHARED_LIBS=OFF \
            -DCMAKE_BUILD_TYPE=Release

          cmake --build . --target sd-cli --config Release -j$(sysctl -n hw.ncpu)

          # Gom tất cả file .o của target sd-cli (bao gồm main.cpp.o và examples/common/*.o)
          mkdir -p cli_objs
          find . -path "*sd-cli*.dir*" -name "*.o" -exec cp {} cli_objs/ \;

          # Tìm file chứa symbol _main và đổi thành _sd_cli_main bằng llvm-objcopy
          LLVM_OBJCOPY="$(brew --prefix llvm)/bin/llvm-objcopy"
          for obj in cli_objs/*.o; do
            if nm -g "$obj" 2>/dev/null | grep -q " _main$"; then
              echo "Renaming _main -> _sd_cli_main in $obj"
              "$LLVM_OBJCOPY" --redefine-sym _main=_sd_cli_main "$obj"
            fi
          done

          # Đóng gói thành thư viện tĩnh libsd_cli_all.a
          ar rcs libsd_cli_all.a cli_objs/*.o
          ranlib libsd_cli_all.a

      - name: Compile Swift & Obj-C++ and Package IPA
        run: |
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          BUILD_DIR="build_out"
          APP_DIR="$BUILD_DIR/Payload/ComfyStudio.app"
          mkdir -p "$APP_DIR"

          # 1. Tạo Info.plist hỗ trợ chia sẻ thư mục Tệp / ComfyStudio
          cat << 'EOF' > "$APP_DIR/Info.plist"
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleExecutable</key>
            <string>ComfyStudio</string>
            <key>CFBundleIdentifier</key>
            <string>com.cuongte92.comfystudio</string>
            <key>CFBundleName</key>
            <string>ComfyStudio</string>
            <key>CFBundleDisplayName</key>
            <string>ComfyStudio</string>
            <key>CFBundleShortVersionString</key>
            <string>1.0.0</string>
            <key>CFBundleVersion</key>
            <string>1</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>LSRequiresIPhoneOS</key>
            <true/>
            <key>MinimumOSVersion</key>
            <string>16.0</string>
            <key>UIFileSharingEnabled</key>
            <true/>
            <key>LSSupportsOpeningDocumentsInPlace</key>
            <true/>
            <key>NSPhotoLibraryUsageDescription</key>
            <string>Chọn ảnh đầu vào cho Img2Img và Inpaint.</string>
            <key>NSPhotoLibraryAddUsageDescription</key>
            <string>Lưu ảnh đã tạo vào thư viện Ảnh.</string>
            <key>NSAppTransportSecurity</key>
            <dict>
              <key>NSAllowsArbitraryLoads</key>
              <true/>
            </dict>
            <key>UILaunchScreen</key>
            <dict/>
          </dict>
          </plist>
          EOF

          # 2. Biên dịch SDWrapper.mm
          clang++ -c Sources/SDWrapper.mm \
            -o "$BUILD_DIR/SDWrapper.o" \
            -arch arm64 \
            -isysroot "$SDK_PATH" \
            -mios-version-min=16.0 \
            -std=c++17 \
            -fobjc-arc \
            -Isd_cpp/include \
            -Isd_cpp/ggml/include

          # 3. Gom tất cả thư viện tĩnh (.a) từ CMake build
          STATIC_LIBS=$(find sd_cpp/build_ios -name "*.a")
          echo "Linking static libs:"
          echo "$STATIC_LIBS"

          # 4. Biên dịch Swift & Link toàn bộ thành binary ComfyStudio
          swiftc Sources/MyApp.swift Sources/ContentView.swift "$BUILD_DIR/SDWrapper.o" \
            -o "$APP_DIR/ComfyStudio" \
            -target arm64-apple-ios16.0 \
            -sdk "$SDK_PATH" \
            -import-objc-header Sources/SDWrapper.h \
            -lc++ \
            -framework Foundation \
            -framework UIKit \
            -framework SwiftUI \
            -framework WebKit \
            -framework PhotosUI \
            -framework UniformTypeIdentifiers \
            -framework Metal \
            -framework MetalKit \
            -framework Accelerate \
            $STATIC_LIBS

          # 5. Nén thành file ComfyStudio.ipa
          cd "$BUILD_DIR"
          zip -r ../ComfyStudio.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ComfyStudio-iOS-IPA
          path: ComfyStudio.ipa

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: ComfyStudio Hybrid v1.0.${{ github.run_number }}
          files: ComfyStudio.ipa
          draft: false
          prerelease: false
