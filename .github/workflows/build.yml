name: Build ComfyStudio Metal IPA

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  build-ios:
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Clone stable-diffusion.cpp
        run: |
          git clone --recursive --depth 1 https://github.com/leejet/stable-diffusion.cpp.git sd_cpp

      - name: Compile stable-diffusion.cpp with Metal for iOS arm64
        run: |
          mkdir -p sd_build
          cd sd_build
          cmake ../sd_cpp \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=16.0 \
            -DCMAKE_BUILD_TYPE=Release \
            -DSD_METAL=ON \
            -DSD_BUILD_SHARED_LIBS=OFF \
            -DSD_BUILD_EXAMPLES=OFF
          cmake --build . --config Release -j $(sysctl -n hw.ncpu)

      - name: Compile Swift + ObjC++ & Package Unsigned IPA
        run: |
          APP_NAME="ComfyStudio"
          BUNDLE_ID="com.cuongte92.comfystudio"
          APP_DIR="Payload/${APP_NAME}.app"
          mkdir -p "$APP_DIR"

          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          CLANG_CXX=$(xcrun --sdk iphoneos --find clang++)
          SWIFTC=$(xcrun --sdk iphoneos --find swiftc)

          CLI_MAIN=$(find sd_cpp/examples -path "*cli*" -name "main.cpp" | head -n 1)
          if [ -z "$CLI_MAIN" ]; then
            CLI_MAIN=$(find sd_cpp/examples -name "main.cpp" | grep -v "server" | head -n 1)
          fi
          CLI_DIR=$(dirname "$CLI_MAIN")
          SD_INC=$(dirname $(find sd_cpp -name "stable-diffusion.h" | head -n 1))

          sed 's/int main(/extern "C" int sd_cli_main(/g' "$CLI_MAIN" > sd_build/sd_cli_bridge.cpp

          INC_FLAGS="-I$CLI_DIR -I$SD_INC -Isd_cpp -Isd_cpp/include -Isd_cpp/examples -Isd_cpp/examples/common -Isd_cpp/ggml/include -Isd_cpp/thirdparty"

          # 1. Compile sd_cli_bridge.cpp
          $CLANG_CXX -c sd_build/sd_cli_bridge.cpp \
            -o sd_build/sd_cli_bridge.o \
            -arch arm64 \
            -isysroot "$SDK_PATH" \
            -miphoneos-version-min=16.0 \
            -std=c++17 -O3 $INC_FLAGS

          # 2. Compile toàn bộ các file .cpp phụ trợ trong examples/common (log.cpp, common.cpp...)
          EXTRA_OBJS=""
          idx=0
          for cpp_file in $(find sd_cpp/examples/common -name "*.cpp" 2>/dev/null); do
            obj_file="sd_build/sd_extra_${idx}.o"
            $CLANG_CXX -c "$cpp_file" \
              -o "$obj_file" \
              -arch arm64 \
              -isysroot "$SDK_PATH" \
              -miphoneos-version-min=16.0 \
              -std=c++17 -O3 $INC_FLAGS
            EXTRA_OBJS="$EXTRA_OBJS $obj_file"
            idx=$((idx + 1))
          done

          # 3. Compile SDWrapper.mm
          $CLANG_CXX -c Sources/SDWrapper.mm \
            -o sd_build/SDWrapper.o \
            -arch arm64 \
            -isysroot "$SDK_PATH" \
            -miphoneos-version-min=16.0 \
            -std=c++17 -O3 -fobjc-arc

          STATIC_LIBS=$(find sd_build -name "*.a" | tr '\n' ' ')

          # 4. Compile Swift + Link Frameworks
          $SWIFTC Sources/MyApp.swift Sources/ContentView.swift sd_build/SDWrapper.o sd_build/sd_cli_bridge.o $EXTRA_OBJS \
            $STATIC_LIBS \
            -import-objc-header Sources/SDWrapper.h \
            -target arm64-apple-ios16.0 \
            -sdk "$SDK_PATH" \
            -O \
            -lc++ \
            -framework UIKit \
            -framework SwiftUI \
            -framework WebKit \
            -framework PhotosUI \
            -framework UniformTypeIdentifiers \
            -framework Metal \
            -framework MetalKit \
            -framework Foundation \
            -framework Accelerate \
            -o "${APP_DIR}/${APP_NAME}"

          find sd_build -name "*.metallib" -exec cp {} "$APP_DIR/" \; || true

          cat <<EOF > "${APP_DIR}/Info.plist"
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>${APP_NAME}</string>
              <key>CFBundleIdentifier</key>
              <string>${BUNDLE_ID}</string>
              <key>CFBundleName</key>
              <string>${APP_NAME}</string>
              <key>CFBundleDisplayName</key>
              <string>ComfyStudio</string>
              <key>CFBundleVersion</key>
              <string>${{ github.run_number }}</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0.${{ github.run_number }}</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>LSRequiresIPhoneOS</key>
              <true/>
              <key>UILaunchScreen</key>
              <dict/>
              <key>UIFileSharingEnabled</key>
              <true/>
              <key>LSSupportsOpeningDocumentsInPlace</key>
              <true/>
              <key>NSAppTransportSecurity</key>
              <dict>
                  <key>NSAllowsArbitraryLoads</key>
                  <true/>
              </dict>
          </dict>
          </plist>
          EOF

          zip -r ComfyStudio_Unsigned.ipa Payload

      - name: Upload Unsigned IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ComfyStudio_Unsigned_IPA
          path: ComfyStudio_Unsigned.ipa

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: ComfyStudio v1.0.${{ github.run_number }} (A19 Pro Metal)
          body: "Bản build tự động ComfyStudio Hybrid (Local Metal + Colab Tunnel)."
          files: ComfyStudio_Unsigned.ipa
